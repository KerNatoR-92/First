<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px;
        overflow: hidden;
        background: #05060a;
        color: #fff;
        font-family: "Noto Sans CJK KR", "Noto Sans KR", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .stage { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; }
      .bg {
        position: absolute; inset: 0;
        width: 1080px; height: 1920px;
        background-image: url("public/bg/10-ripple.jpg");
        background-size: cover;
        background-position: center;
        transform: scale(1.08);
        filter: contrast(1.05) saturate(0.95);
      }
      .veil {
        position: absolute; inset: 0;
        background:
          radial-gradient(ellipse at 50% 40%, rgba(5,6,10,0.25) 0%, rgba(5,6,10,0.85) 100%),
          linear-gradient(180deg, rgba(5,6,10,0.55) 0%, rgba(5,6,10,0.20) 45%, rgba(5,6,10,0.92) 100%);
      }

      /* channel mark top-left */
      .brand {
        position: absolute;
        top: 60px; left: 60px;
        display: flex; align-items: center; gap: 14px;
      }
      .brand .dot {
        width: 20px; height: 20px; border-radius: 50%;
        background: #ffe86b;
        box-shadow: 0 0 24px rgba(255,232,107,0.55);
      }
      .brand .chan {
        font-size: 34px; font-weight: 900;
        color: #ffffff;
        letter-spacing: -0.01em;
      }

      /* top kicker chip */
      .kicker {
        position: absolute;
        top: 380px; left: 50%;
        transform: translateX(-50%);
        display: inline-block;
        font-size: 34px; font-weight: 900;
        letter-spacing: 0.16em;
        color: #05060a;
        background: #ffe86b;
        padding: 12px 26px;
        border-radius: 10px;
        white-space: nowrap;
      }

      /* main headline */
      .head {
        position: absolute;
        left: 60px; right: 60px;
        top: 500px;
        text-align: center;
        font-weight: 900;
        line-height: 1.02;
        letter-spacing: -0.045em;
        color: #ffffff;
        text-shadow:
          0 0 40px rgba(0,0,0,0.85),
          0 8px 40px rgba(0,0,0,0.7);
      }
      .head .l1 { display: block; font-size: 190px; }
      .head .l2 { display: block; font-size: 190px; }
      .head .accent { color: #ffe86b; }

      /* stat / hook line */
      .hook {
        position: absolute;
        left: 60px; right: 60px;
        bottom: 340px;
        text-align: center;
        font-size: 62px; font-weight: 800;
        color: #ffffff;
        letter-spacing: -0.02em;
        line-height: 1.15;
        text-shadow: 0 6px 30px rgba(0,0,0,0.85);
      }
      .hook .hl { color: #ffe86b; }

      /* rain-drops accent */
      .drops {
        position: absolute;
        bottom: 190px; left: 0; right: 0;
        text-align: center;
        font-size: 74px;
        opacity: 0.75;
      }

      /* bottom footer bar */
      .footer {
        position: absolute;
        left: 0; right: 0; bottom: 0;
        height: 130px;
        background: rgba(5,6,10,0.85);
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 60px;
        border-top: 3px solid #ffe86b;
      }
      .footer .tag {
        font-size: 30px; font-weight: 800;
        color: #ffe86b;
        letter-spacing: 0.14em;
      }
      .footer .cta {
        font-size: 30px; font-weight: 800;
        color: #ffffff;
      }

      /* corner decoration */
      .corner-tl, .corner-br {
        position: absolute;
        width: 90px; height: 90px;
        border: 6px solid #ffe86b;
      }
      .corner-tl {
        top: 40px; right: 40px;
        border-right: none; border-bottom: none;
      }
      .corner-br {
        bottom: 180px; left: 40px;
        border-left: none; border-top: none;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="bg"></div>
      <div class="veil"></div>

      <div class="brand">
        <span class="dot"></span>
        <span class="chan">잡지식탁</span>
      </div>

      <div class="kicker">잡다한 지식, 무릎 탁!</div>

      <div class="head">
        <span class="l1">비 오면</span>
        <span class="l2">왜 <span class="accent">흙냄새</span>?</span>
      </div>

      <div class="hook">
        사실 <span class="hl">비 냄새가 아닙니다.</span>
      </div>

      <div class="drops">💧 · 💧 · 💧</div>

      <div class="footer">
        <span class="tag">▶ EP.01 · 무릎탁</span>
        <span class="cta">지금 보러 가기</span>
      </div>
    </div>
  </body>
</html>
