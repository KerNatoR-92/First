<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <style>
      @font-face {
        font-family: "NotoKR";
        src: url("public/vendor/NotoSansKR-Regular.woff2") format("woff2");
        font-weight: 400; font-display: block;
      }
      @font-face {
        font-family: "NotoKR";
        src: url("public/vendor/NotoSansKR-Bold.woff2") format("woff2");
        font-weight: 700; font-display: block;
      }
      @font-face {
        font-family: "NotoKR";
        src: url("public/vendor/NotoSansKR-Black.woff2") format("woff2");
        font-weight: 900; font-display: block;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden;
        background: #05060a;
        font-family: "NotoKR", sans-serif;
        -webkit-font-smoothing: antialiased;
        color: #ffffff;
      }
      #root {
        position: relative; width: 1080px; height: 1920px; overflow: hidden;
      }
      .bg {
        position: absolute; inset: 0;
        background-image: url('public/bg/01.jpg');
        background-size: cover; background-position: center;
      }
      .veil {
        position: absolute; inset: 0;
        background: linear-gradient(180deg,
          rgba(5,6,10,0.78) 0%,
          rgba(5,6,10,0.60) 40%,
          rgba(5,6,10,0.68) 70%,
          rgba(5,6,10,0.82) 100%);
      }

      /* Top-left brand chip: yellow dot + wordmark */
      .brand {
        position: absolute; top: 60px; left: 80px;
        display: flex; align-items: center; gap: 20px;
      }
      .brand .dot {
        width: 22px; height: 22px; border-radius: 50%;
        background: #ffe86b;
        box-shadow: 0 0 12px rgba(255,232,107,0.5);
      }
      .brand .wm {
        font-weight: 900; font-size: 42px; letter-spacing: -0.02em;
        color: #ffffff;
        text-shadow: 0 2px 12px rgba(0,0,0,0.7);
      }

      /* CENTER-aligned huge title, positioned around mid */
      .title-block {
        position: absolute;
        left: 60px; right: 60px;
        top: 50%; transform: translateY(-50%);
        display: flex; flex-direction: column;
        align-items: center; text-align: center;
      }
      .title-block .line {
        font-weight: 900;
        font-size: 156px;
        line-height: 1.02;
        letter-spacing: -0.045em;
        color: #ffffff;
        white-space: nowrap; word-break: keep-all;
        text-shadow: 0 3px 20px rgba(0,0,0,0.85), 0 0 40px rgba(0,0,0,0.5);
      }
      .title-block .line + .line { margin-top: 8px; }
      .title-block .line .accent { color: #ffe86b; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="bg"></div>
      <div class="veil"></div>

      <div class="brand">
        <span class="dot"></span>
        <span class="wm">잡지식탁</span>
      </div>

      <div class="title-block">
        <div class="line">샤워 후 거울</div>
        <div class="line"><span class="accent">왜</span> 뿌예질까?</div>
      </div>
    </div>
  </body>
</html>
