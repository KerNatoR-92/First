<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <style>
      @font-face {
        font-family: "NotoKR";
        src: url("public/vendor/NotoSansKR-Regular.woff2") format("woff2");
        font-weight: 400; font-display: block;
      }
      @font-face {
        font-family: "NotoKR";
        src: url("public/vendor/NotoSansKR-Bold.woff2") format("woff2");
        font-weight: 700; font-display: block;
      }
      @font-face {
        font-family: "NotoKR";
        src: url("public/vendor/NotoSansKR-Black.woff2") format("woff2");
        font-weight: 900; font-display: block;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden;
        background: #05060a;
        font-family: "NotoKR", sans-serif;
        -webkit-font-smoothing: antialiased;
        color: #ffffff;
      }
      #root {
        position: relative; width: 1080px; height: 1920px; overflow: hidden;
      }
      .bg {
        position: absolute; inset: 0;
        background-image: url('public/bg/01.jpg');
        background-size: cover; background-position: center;
      }
      /* Strong dark veil for readability, but not fully black — first bg still visible */
      .veil {
        position: absolute; inset: 0;
        background: linear-gradient(180deg,
          rgba(5,6,10,0.62) 0%,
          rgba(5,6,10,0.42) 25%,
          rgba(5,6,10,0.72) 55%,
          rgba(5,6,10,0.88) 100%);
      }
      /* Brand top-left */
      .brand {
        position: absolute; top: 60px; left: 60px;
        display: flex; align-items: center; gap: 22px;
      }
      .brand .icon {
        width: 160px; height: 160px; border-radius: 50%;
        object-fit: cover; overflow: hidden;
        box-shadow: 0 0 22px rgba(255,232,107,0.35), 0 4px 18px rgba(0,0,0,0.65);
      }
      .brand .wm {
        font-weight: 900; font-size: 52px; letter-spacing: -0.02em;
        color: #ffffff; text-shadow: 0 2px 12px rgba(0,0,0,0.7);
      }

      /* Center big title */
      .title-block {
        position: absolute;
        left: 60px; right: 60px;
        top: 50%; transform: translateY(-50%);
        display: flex; flex-direction: column; align-items: center;
        text-align: center;
        gap: 12px;
      }
      .title-block .eyebrow {
        font-weight: 700; font-size: 44px; letter-spacing: 0.28em;
        color: #ffe86b; text-transform: uppercase;
        text-shadow: 0 2px 10px rgba(0,0,0,0.6);
        margin-bottom: 26px;
      }
      .title-block .line {
        font-weight: 900; font-size: 154px; line-height: 1.02;
        letter-spacing: -0.045em; color: #ffffff;
        text-shadow: 0 3px 20px rgba(0,0,0,0.85), 0 0 40px rgba(0,0,0,0.5);
      }
      .title-block .line .accent { color: #ffe86b; }

      /* Bottom hook */
      .bottom-hook {
        position: absolute; left: 0; right: 0; bottom: 180px;
        text-align: center;
        font-weight: 800; font-size: 62px; letter-spacing: -0.02em;
        color: #ffffff; text-shadow: 0 2px 14px rgba(0,0,0,0.85);
      }
      .bottom-hook .accent { color: #ffe86b; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="bg"></div>
      <div class="veil"></div>

      <div class="brand">
        <img class="icon" src="public/brand/channel-icon.png" alt="잡지식탁" />
        <span class="wm">잡지식탁</span>
      </div>

      <div class="title-block">
        <div class="eyebrow">오늘의 궁금증</div>
        <div class="line">샤워 후 거울</div>
        <div class="line"><span class="accent">왜</span> 뿌예질까?</div>
      </div>

      <div class="bottom-hook">
        정답은 <span class="accent">응결</span> 현상
      </div>
    </div>
  </body>
</html>
