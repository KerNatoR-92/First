<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="../public/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Noto Sans KR";
        font-style: normal;
        font-weight: 400;
        src: url("../public/fonts/NotoSansKR-Regular.ttf") format("truetype");
      }
      @font-face {
        font-family: "Noto Sans KR";
        font-style: normal;
        font-weight: 700;
        src: url("../public/fonts/NotoSansKR-Bold.ttf") format("truetype");
      }
      @font-face {
        font-family: "Noto Sans KR";
        font-style: normal;
        font-weight: 900;
        src: url("../public/fonts/NotoSansKR-Black.ttf") format("truetype");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #05060a;
        font-family: "Noto Sans KR", sans-serif;
        -webkit-font-smoothing: antialiased;
        color: #ffffff;
      }
      .canvas-bg { position: absolute; inset: 0; background: #05060a; }

      /* Full-bleed background */
      .thumb-bg {
        position: absolute; inset: 0;
        background-image: url("../public/bg/bg-01.jpg");
        background-size: cover;
        background-position: center;
      }
      /* Dark veil for text legibility (light grade to keep photo mood) */
      .veil {
        position: absolute; inset: 0;
        background:
          linear-gradient(180deg, rgba(0,0,0,0.30) 0%, rgba(0,0,0,0.15) 25%, rgba(0,0,0,0.55) 65%, rgba(0,0,0,0.80) 100%);
      }

      /* Small brand mark: yellow dot + white text */
      .brand {
        position: absolute;
        top: 60px; left: 60px;
        display: flex; align-items: center; gap: 18px;
      }
      .brand .dot {
        width: 22px; height: 22px;
        border-radius: 999px;
        background: #ffe86b;
        box-shadow: 0 0 14px rgba(255,232,107,0.55);
      }
      .brand .name {
        color: #ffffff;
        font-size: 44px;
        font-weight: 900;
        letter-spacing: -0.02em;
        text-shadow: 0 2px 10px rgba(0,0,0,0.7);
      }

      /* Big centered question text — 2 lines, mid-lower area (~44%) */
      .hero {
        position: absolute;
        left: 0; right: 0;
        top: 830px;
        text-align: center;
        color: #ffffff;
        font-weight: 900;
        font-size: 156px;
        line-height: 1.02;
        letter-spacing: -0.045em;
        text-shadow:
          0 8px 26px rgba(0,0,0,0.95),
          0 2px 6px rgba(0,0,0,0.95);
      }
      .hero .row {
        display: block;
        white-space: nowrap;
      }
      .hero .accent {
        color: #ffe86b;
        text-shadow:
          0 0 22px rgba(255,232,107,0.55),
          0 8px 26px rgba(0,0,0,0.95);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="thumbnail"
      data-start="0"
      data-duration="2"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <div class="canvas-bg"></div>
      <div class="thumb-bg"></div>
      <div class="veil"></div>

      <div class="brand">
        <span class="dot"></span>
        <span class="name">잡지식탁</span>
      </div>

      <div class="hero">
        <span class="row">탄산음료 흔들면</span>
        <span class="row">왜 <span class="accent">폭발</span>할까?</span>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["thumbnail"] = tl;
    </script>
  </body>
</html>
