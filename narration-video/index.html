<!doctype html>
<html lang="ko" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #08090d;
        font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
        color: #ffffff;
        -webkit-font-smoothing: antialiased;
      }
      .mono { font-family: "JetBrains Mono", "Menlo", monospace; letter-spacing: 0.02em; }

      /* ---- Layout ---- */
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        background:
          radial-gradient(1200px 800px at 60% 45%, #14161f 0%, #0a0b12 55%, #06070b 100%);
        overflow: hidden;
      }

      /* Corner brackets (yellow) */
      .bracket {
        position: absolute;
        width: 46px;
        height: 46px;
        border-color: #ffd400;
        border-style: solid;
        border-width: 0;
      }
      .bracket.tl { top: 44px; left: 60px; border-top-width: 2px; border-left-width: 2px; }
      .bracket.tr { top: 44px; right: 60px; border-top-width: 2px; border-right-width: 2px; }
      .bracket.bl { bottom: 44px; left: 60px; border-bottom-width: 2px; border-left-width: 2px; }
      .bracket.br { bottom: 44px; right: 60px; border-bottom-width: 2px; border-right-width: 2px; }

      /* Header kicker */
      .kicker {
        position: absolute;
        top: 60px;
        left: 120px;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 18px;
        letter-spacing: 0.38em;
        color: #ffffff;
        text-transform: uppercase;
      }
      .kicker .dot {
        width: 10px; height: 10px; border-radius: 50%;
        background: #ffd400; box-shadow: 0 0 12px rgba(255,212,0,0.55);
      }
      .kicker .dim { color: #cfd1d6; }
      .kicker .slash { color: #ffd400; margin: 0 4px; }

      .header-line {
        position: absolute;
        top: 108px;
        left: 120px;
        width: 240px;
        height: 1px;
        background: #ffd400;
        transform-origin: left;
      }
      /* GSAP owns bars scaleY — no initial CSS transform */

      /* Chapter big block (contains chapter number + labels) */
      .chapter {
        position: absolute;
        top: 300px;
        left: 120px;
        width: 1080px;
        color: #fff;
      }
      .chapter .lead {
        font-family: "JetBrains Mono", monospace;
        font-size: 22px;
        letter-spacing: 0.42em;
        color: #dcdde1;
        text-transform: uppercase;
        margin-bottom: 40px;
        line-height: 1.2;
      }
      .chapter .num {
        display: block;
        height: 260px;
        font-size: 260px;
        line-height: 260px;
        font-weight: 200;
        color: #ffd400;
        letter-spacing: -0.02em;
        font-family: "Inter", sans-serif;
      }
      .chapter .num .sep {
        color: rgba(255,255,255,0.35);
        font-weight: 100;
        margin: 0 0.08em;
      }
      .chapter .num .of {
        color: #cfd1d6;
        font-size: 60px;
        vertical-align: super;
        margin-left: 0.15em;
        letter-spacing: 0.1em;
        line-height: 1;
      }
      .chapter .title {
        margin-top: 56px;
        font-size: 56px;
        font-weight: 300;
        letter-spacing: 0.02em;
        color: #ffffff;
        line-height: 1.2;
      }
      .chapter .title .accent { color: #ffd400; }
      .chapter .range {
        margin-top: 24px;
        font-family: "JetBrains Mono", monospace;
        font-size: 20px;
        letter-spacing: 0.24em;
        color: #cfd1d6;
        line-height: 1.3;
      }
      .chapter .range .bar {
        display: inline-block;
        width: 46px; height: 1px;
        background: #8b8d92;
        vertical-align: middle;
        margin: 0 14px;
      }

      /* Yellow growing underline near title */
      .grow-line {
        position: absolute;
        top: 900px;
        left: 120px;
        height: 2px;
        background: #ffd400;
        transform-origin: left center;
        width: 0px;
      }

      /* Vertical bar rig (right side) — decorative "waveform" */
      #bars {
        position: absolute;
        top: 300px;
        right: 130px;
        width: 460px;
        height: 480px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 4px;
      }
      #bars .bar {
        flex: 1 1 0;
        height: 100%;
        background: linear-gradient(to top, #ffd400 0%, rgba(255,212,0,0.15) 100%);
        border-radius: 1px;
        transform-origin: bottom;
      }
      #bars .bar.w {
        background: linear-gradient(to top, #ffffff 0%, rgba(255,255,255,0.12) 100%);
      }
      #bars-baseline {
        position: absolute;
        top: 782px;
        right: 130px;
        width: 460px;
        height: 1px;
        background: rgba(255,255,255,0.15);
      }
      #bars-label {
        position: absolute;
        top: 260px;
        right: 130px;
        width: 460px;
        display: flex;
        justify-content: space-between;
        font-family: "JetBrains Mono", monospace;
        font-size: 14px;
        letter-spacing: 0.24em;
        color: #cfd1d6;
        text-transform: uppercase;
      }
      #bars-label .accent { color: #ffd400; }

      /* Right side vertical index (thin rule + phrase marks) */
      #index-col {
        position: absolute;
        top: 300px;
        right: 60px;
        width: 40px;
        height: 480px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
      }
      #index-col .tick {
        width: 12px;
        height: 1px;
        background: rgba(255,255,255,0.28);
        transition: none;
      }
      #index-col .tick.big { width: 28px; background: #ffd400; height: 2px; }

      /* Bottom progress rig */
      #progress {
        position: absolute;
        left: 120px;
        right: 120px;
        bottom: 130px;
        height: 60px;
      }
      #progress .rail {
        position: absolute;
        left: 0; right: 0; top: 30px;
        height: 1px;
        background: rgba(255,255,255,0.18);
      }
      #progress .fill {
        position: absolute;
        left: 0; top: 29px;
        height: 3px;
        width: 0px;
        background: #ffd400;
        box-shadow: 0 0 10px rgba(255,212,0,0.4);
      }
      #progress .chapter-mark {
        position: absolute;
        top: 18px;
        width: 1px;
        height: 24px;
        background: rgba(255,255,255,0.4);
      }
      #progress .chapter-mark .lbl {
        position: absolute;
        top: -28px;
        left: 8px;
        font-family: "JetBrains Mono", monospace;
        font-size: 14px;
        letter-spacing: 0.24em;
        color: #cfd1d6;
        white-space: nowrap;
      }
      #progress .phrase-mark {
        position: absolute;
        top: 40px;
        width: 1px;
        height: 10px;
        background: rgba(255,255,255,0.22);
      }
      #progress .phrase-mark.on {
        background: #ffd400;
      }
      #progress .tc {
        position: absolute;
        left: 0;
        bottom: -30px;
        font-family: "JetBrains Mono", monospace;
        font-size: 15px;
        letter-spacing: 0.2em;
        color: #dcdde1;
      }
      #progress .tc.end {
        left: auto;
        right: 0;
        color: #cfd1d6;
      }

      /* Footer meta */
      .footer-meta {
        position: absolute;
        left: 120px;
        bottom: 60px;
        display: flex;
        gap: 34px;
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        letter-spacing: 0.32em;
        color: #cfd1d6;
        text-transform: uppercase;
      }
      .footer-meta .val { color: #ffffff; margin-left: 8px; }
      .footer-meta .amp { color: #ffd400; }

      /* Diagonal accent hairline */
      .diag {
        position: absolute;
        pointer-events: none;
      }

      /* Chapter card wrapper — used for cross-fade between 01 and 02 */
      .chapter { will-change: opacity, transform; }

      /* Initial hidden state for animated pieces (safe: not on .clip and not visibility) */
      .fade-init { opacity: 0; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="118"
      data-width="1920"
      data-height="1080"
    >
      <!-- Full-bleed background layer (required by full-screen-fill rule) -->
      <div id="bg" style="position:absolute; inset:0; background:#08090d;"></div>

      <div id="stage">
        <!-- Corner brackets -->
        <span class="bracket tl fade-init"></span>
        <span class="bracket tr fade-init"></span>
        <span class="bracket bl fade-init"></span>
        <span class="bracket br fade-init"></span>

        <!-- Top kicker -->
        <div class="kicker fade-init" id="kicker">
          <span class="dot"></span>
          <span>Narration</span>
          <span class="slash">/</span>
          <span class="dim mono">Session · A</span>
        </div>
        <div class="header-line fade-init" id="header-line"></div>

        <!-- Diagonal minor hairline (top-right) -->
        <svg class="diag" style="top: 40px; right: 120px; width: 260px; height: 90px;" viewBox="0 0 260 90" fill="none">
          <path id="diag-path" d="M 6 84 L 254 6" stroke="#ffd400" stroke-width="1" stroke-dasharray="260" stroke-dashoffset="260" />
          <circle cx="6" cy="84" r="3" fill="#ffd400" opacity="0" id="diag-dot" />
        </svg>

        <!-- Chapter 01 -->
        <div class="chapter fade-init" id="ch1">
          <div class="lead">Part One</div>
          <div class="num">01<span class="of">/ 02</span></div>
          <div class="title">Opening<span class="accent"> · </span><span>첫 번째 이야기</span></div>
          <div class="range">00 : 00 <span class="bar"></span> 00 : 43</div>
        </div>

        <!-- Chapter 02 (hidden until transition) -->
        <div class="chapter fade-init" id="ch2" style="opacity:0;">
          <div class="lead">Part Two</div>
          <div class="num">02<span class="of">/ 02</span></div>
          <div class="title">Continuation<span class="accent"> · </span><span>두 번째 이야기</span></div>
          <div class="range">00 : 43 <span class="bar"></span> 01 : 57</div>
        </div>

        <!-- Growing yellow underline near lower left -->
        <div class="grow-line" id="grow-line"></div>

        <!-- Right-side bar rig -->
        <div id="bars-label" class="fade-init">
          <span>WAVE</span>
          <span class="accent">SIGNAL 22</span>
        </div>
        <div id="bars"></div>
        <div id="bars-baseline" class="fade-init"></div>

        <!-- Right index column -->
        <div id="index-col"></div>

        <!-- Bottom progress rig -->
        <div id="progress" class="fade-init">
          <div class="rail"></div>
          <div class="fill" id="prog-fill"></div>
          <div id="phrase-marks"></div>
          <div class="chapter-mark" id="ch-mark" style="left: 0%;">
            <span class="lbl">01</span>
          </div>
          <div class="chapter-mark" id="ch-mark2" style="left: 36.3%;">
            <span class="lbl">02</span>
          </div>
          <div class="tc mono">T · 00 : 00</div>
          <div class="tc end mono">01 : 57</div>
        </div>

        <div class="footer-meta fade-init" id="footer-meta">
          <div>Format<span class="val">1920 × 1080</span></div>
          <div>Frame<span class="val">30 fps</span></div>
          <div>Runtime<span class="val">01 : 57</span></div>
          <div>Audio<span class="val amp">A1 + A2</span></div>
        </div>

        <!-- Audio tracks (framework-owned playback) -->
        <audio
          id="a1-audio"
          class="clip"
          src="assets/A1.wav"
          data-start="0"
          data-duration="42.76"
          data-track-index="10"
          data-volume="1"
        ></audio>
        <audio
          id="a2-audio"
          class="clip"
          src="assets/A2.wav"
          data-start="42.76"
          data-duration="74.36"
          data-track-index="10"
          data-volume="1"
        ></audio>
      </div>
    </div>

    <script>
      // ---- Sync data (from ffmpeg silencedetect) ----
      const A1 = { start: 0.0, dur: 42.76, phrases: [
        [0.000, 2.925], [3.669, 6.771], [7.285, 13.962], [14.335, 20.733],
        [21.097, 26.420], [26.771, 31.881], [32.252, 39.910], [40.307, 42.759]
      ]};
      const A2 = { start: 42.76, dur: 74.36, phrases: [
        [0.381, 2.422], [2.944, 7.163], [7.780, 9.821], [10.232, 13.733],
        [14.328, 17.599], [18.004, 19.695], [20.483, 23.124], [23.568, 26.248],
        [26.807, 29.666], [30.070, 34.230], [34.599, 37.242], [37.633, 45.952],
        [46.359, 56.591], [57.101, 74.358]
      ]};

      const TOTAL = 117.12;   // A1 + A2 exact
      const CH2_AT = 42.76;
      const CH2_TRANSITION_DUR = 1.2;

      // Build phrase marks and index ticks and vertical bars
      const phraseMarks = document.getElementById("phrase-marks");
      const indexCol = document.getElementById("index-col");
      const bars = document.getElementById("bars");

      const allPhrases = [];
      A1.phrases.forEach((p, i) => allPhrases.push({ chapter: 1, idx: i, start: p[0], end: p[1] }));
      A2.phrases.forEach((p, i) => allPhrases.push({ chapter: 2, idx: i, start: A2.start + p[0], end: A2.start + p[1] }));

      allPhrases.forEach((ph, i) => {
        // progress bar tick
        const m = document.createElement("div");
        m.className = "phrase-mark";
        m.style.left = (ph.start / TOTAL * 100) + "%";
        m.id = "pm-" + i;
        phraseMarks.appendChild(m);
      });

      // Right index column: one tick per phrase (spaced evenly)
      allPhrases.forEach((_, i) => {
        const t = document.createElement("div");
        t.className = "tick";
        t.id = "ix-" + i;
        indexCol.appendChild(t);
      });

      // Vertical bars: N bars driven by per-phrase pseudo-random pattern (deterministic)
      const BAR_COUNT = 22;
      for (let i = 0; i < BAR_COUNT; i++) {
        const b = document.createElement("div");
        b.className = "bar" + (i % 3 === 0 ? " w" : "");
        b.id = "bar-" + i;
        bars.appendChild(b);
      }
      // Initial bar scale set via GSAP (owns transform) at t=0
      gsap.set("#bars .bar", { scaleY: 0.08 });

      // Deterministic pseudo-random from a seed (mulberry32)
      function mulberry32(a) {
        return function() {
          a |= 0; a = a + 0x6D2B79F5 | 0;
          let t = a; t = Math.imul(t ^ t >>> 15, t | 1);
          t ^= t + Math.imul(t ^ t >>> 7, t | 61);
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
      }

      // ---- Timeline ----
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out" } });

      // 0. Background + corners fade in (0–1.4s)
      tl.to("#bg", { duration: 0.6, opacity: 1 }, 0);
      tl.to(".bracket", { opacity: 1, duration: 1.0, stagger: 0.08 }, 0.15);

      // Kicker, header, diagonal
      tl.fromTo("#kicker", { y: -12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8 }, 0.3);
      tl.fromTo("#header-line", { scaleX: 0 }, { scaleX: 1, duration: 1.0, ease: "expo.out" }, 0.6);
      tl.to("#diag-path", { attr: { "stroke-dashoffset": 0 }, duration: 1.0, ease: "power3.out" }, 0.5);
      tl.to("#diag-dot", { opacity: 1, duration: 0.3 }, 1.4);

      // 1. Chapter 01 reveal (0.4–2.6s)
      tl.to("#ch1", { opacity: 1, duration: 0.8 }, 0.4);
      tl.fromTo("#ch1 .lead", { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8 }, 0.55);
      tl.fromTo("#ch1 .num", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 1.1, ease: "expo.out" }, 0.65);
      tl.fromTo("#ch1 .title", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.9 }, 0.95);
      tl.fromTo("#ch1 .range", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 1.25);

      // 2. Bars label + baseline
      tl.to("#bars-label", { opacity: 1, duration: 0.6 }, 0.9);
      tl.to("#bars-baseline", { opacity: 1, duration: 0.6 }, 1.0);

      // 3. Footer + progress rig
      tl.to("#footer-meta", { opacity: 1, duration: 0.8 }, 1.3);
      tl.to("#progress", { opacity: 1, duration: 0.8 }, 1.2);

      // 4. Progress fill grows linearly across the whole thing
      // Rail spans stage minus 240px padding (120 left + 120 right) — constant 1680px.
      const RAIL_WIDTH = 1920 - 240;
      tl.fromTo("#prog-fill", { width: 0 }, { width: RAIL_WIDTH, duration: TOTAL, ease: "none" }, 0);

      // 5. Yellow growing underline (grow across each chapter)
      // ch1: 0..42.76 grows from 0 to ~700px
      tl.fromTo("#grow-line", { width: 0 }, { width: 640, duration: A1.dur, ease: "none" }, 0);
      // reset & grow again in ch2
      tl.set("#grow-line", { width: 0 }, CH2_AT);
      tl.fromTo("#grow-line", { width: 0 }, { width: 780, duration: A2.dur, ease: "none" }, CH2_AT);

      // 6. Per-phrase kinetic beats — highlight phrase marks + reshape bars
      const rand = mulberry32(9137);
      allPhrases.forEach((ph, i) => {
        // Progress bar mark lights up when phrase starts
        tl.to("#pm-" + i, { backgroundColor: "#ffd400", duration: 0.15 }, ph.start);
        // Right index tick expands
        tl.to("#ix-" + i, { width: 28, height: 2, backgroundColor: "#ffd400", duration: 0.18 }, ph.start);
        // At start of each phrase, set new bar shape (deterministic pattern per phrase)
        const targets = [];
        for (let b = 0; b < BAR_COUNT; b++) {
          const base = 0.15 + rand() * 0.85;
          targets.push(base);
        }
        // Animate each bar to its target height across the phrase duration
        const phraseDur = Math.max(0.4, ph.end - ph.start);
        targets.forEach((t, b) => {
          tl.to("#bar-" + b, {
            scaleY: t,
            duration: Math.min(0.35, phraseDur * 0.35),
            ease: "power2.out"
          }, ph.start);
        });
      });

      // 7. Chapter transition at CH2_AT
      // Slide ch1 out (yellow bar sweep + fade), ch2 in
      tl.to("#ch1", { opacity: 0, x: -80, duration: CH2_TRANSITION_DUR, ease: "power2.inOut" }, CH2_AT - 0.6);
      tl.fromTo("#ch2",
        { opacity: 0, x: 80 },
        { opacity: 1, x: 0, duration: CH2_TRANSITION_DUR, ease: "power2.out" },
        CH2_AT + 0.05
      );
      tl.fromTo("#ch2 .num", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 1.0, ease: "expo.out" }, CH2_AT + 0.25);
      tl.fromTo("#ch2 .lead", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.7 }, CH2_AT + 0.15);
      tl.fromTo("#ch2 .title", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.9 }, CH2_AT + 0.55);
      tl.fromTo("#ch2 .range", { opacity: 0 }, { opacity: 1, duration: 0.6 }, CH2_AT + 0.9);

      // 8. Kicker session label changes to Session B at chapter 2
      tl.to("#kicker .dim", { opacity: 0, duration: 0.3 }, CH2_AT - 0.4);
      tl.call(() => {
        const dim = document.querySelector("#kicker .dim");
        if (dim) dim.textContent = "Session · B";
      }, [], CH2_AT + 0.1);
      tl.to("#kicker .dim", { opacity: 1, duration: 0.4 }, CH2_AT + 0.15);

      // 9. Subtle overall breathing on chapter numbers (scale via transform — seek-safe)
      tl.fromTo("#ch1 .num", { scale: 1.0 }, { scale: 1.006, duration: A1.dur, ease: "sine.inOut", transformOrigin: "left center" }, 0);
      tl.fromTo("#ch2 .num", { scale: 1.0 }, { scale: 1.006, duration: A2.dur, ease: "sine.inOut", transformOrigin: "left center" }, CH2_AT);

      // 10. Outro (last 1.4s) — gentle brightness pull-down on bars
      const OUT_AT = TOTAL - 1.2;
      tl.to("#bars .bar", { scaleY: 0.06, duration: 1.0, ease: "power2.in" }, OUT_AT);
      tl.to("#grow-line", { opacity: 0.4, duration: 0.8 }, OUT_AT);
      tl.to("#stage", { opacity: 0.5, duration: 1.0 }, OUT_AT);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
